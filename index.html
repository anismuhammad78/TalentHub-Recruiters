<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentHub Recruiters</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <h1>TalentHub Recruiters</h1>
    <p>Browse the latest openings</p>
  </header>

  <main class="container">

    <section class="filters" aria-label="Search and filters">
      <input
        type="search"
        id="searchInput"
        placeholder="Search by job title or company..."
        aria-label="Search jobs"
      >
      <select id="categorySelect" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>
    </section>

    <div class="list-status">
      <p id="resultsCount" class="results-count" aria-live="polite"></p>
      <p id="wishlistCount" class="wishlist-count" aria-live="polite">♥ Saved jobs: <strong>0</strong></p>
    </div>

    <section id="jobGrid" class="job-grid" aria-label="Job listings"></section>

    <p id="noResults" class="no-results" hidden>
      No jobs match your search. Try a different keyword or category.
    </p>

  </main>


  <!-- Accessible job details modal -->
  <div
    id="jobModal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalDescription"
    aria-hidden="true"
    hidden
  >
    <section class="modal-content">
      <button
        type="button"
        id="closeModal"
        class="modal-close"
        aria-label="Close job details"
      >&times;</button>

      <p id="modalCategory" class="modal-category"></p>
      <h2 id="modalTitle" tabindex="-1"></h2>
      <p id="modalCompany" class="modal-company"></p>
      <p id="modalMeta" class="modal-meta"></p>
      <h3>Job description</h3>
      <p id="modalDescription"></p>
      <button type="button" id="applyButton" class="apply-button">
        Apply Now
      </button>
      <p id="applyStatus" class="apply-status" role="status" aria-live="polite"></p>
    </section>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 TalentHub Recruiters</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
